name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag (e.g. v1.0.1, leave empty for auto timestamp)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🟢 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests & Typecheck
        run: |
          npm run typecheck
          npm test

      - name: 🏗️ Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --non-interactive

      - name: 🐘 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Make Gradlew executable
        run: chmod +x android/gradlew

      - name: 🚀 Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 📋 Find generated APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          cp "$APK_PATH" coding-coach.apk

      - name: 🏷️ Determine Tag Name
        id: get_tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="v$(node -p "require('./package.json').version")-$(date +'%Y%m%d%H%M')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 📦 Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Coding Coach ${{ steps.get_tag.outputs.tag }}
          files: coding-coach.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Auto-Delete Older Releases (Keep Latest 2 to Save Storage)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 2
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
